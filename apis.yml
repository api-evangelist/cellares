name: Cellares
description: Cellares is an Integrated Development and Manufacturing Organization (IDMO)
  for cell therapies, operating a global network of automated "Smart Factories." Its
  FDA-recognized Cell Shuttle platform delivers high-throughput, end-to-end, cGMP industrial-scale
  cell therapy manufacturing, and its Cell Q platform automates quality-control testing of
  cell therapy products. Smart Factories operate in South San Francisco (CA), Bridgewater (NJ),
  Leiden (Netherlands), and Kashiwa (Japan). Cellares was surfaced as a portfolio company of
  8vc and profiled in the API Evangelist network; as a cell therapy manufacturing organization
  it publishes no public developer API surface at this time.
